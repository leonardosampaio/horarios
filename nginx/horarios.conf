# Publica a versão pública (public/) em https://SEU-DOMINIO/horarios/
# Incluir dentro do bloco "server" do site (include snippets/horarios.conf;).
# Os arquivos são copiados por bash/publicar.sh para a pasta abaixo; se mudar o DEST do script, mude aqui também.
location = /horarios {
    return 301 /horarios/;
}
location /horarios/ {
    alias /var/www/html/leonardosampaio.dev/horarios/;
    index index.html;

    # Só app.min.js e style.css levam hash no nome (?v=...); vendor/ e milp-worker.js não. Com "no-cache" o
    # navegador (e o Cloudflare) guarda tudo, mas revalida pelo ETag: uma publicação nova vale na hora.
    add_header Cache-Control "no-cache";

    # o HiGHS embutido em base64 (vendor/highs-wasm.js) tem ~4,7 MB; text/html já é comprimido por padrão
    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 1024;
}
